<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>MADSET — Shared Training Plan</title>
<style>
  :root { --bg:#0a0a0a; --ink:#f2f2f2; --muted:#9a9a9a; --dim:#5c5c5c; --line:rgba(255,255,255,.09); --card:#121212; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif; min-height:100vh; }
  .wrap { max-width:560px; margin:0 auto; padding:32px 20px 48px; }
  .brand { font-family:ui-monospace,"SF Mono",Menlo,monospace; font-size:15px; letter-spacing:.22em; color:var(--muted); }
  .kicker { margin-top:28px; font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--dim); }
  h1 { margin-top:8px; font-size:30px; font-weight:800; letter-spacing:-.01em; }
  .day { margin-top:14px; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px 16px; }
  .dayhead { display:flex; gap:10px; align-items:baseline; margin-bottom:8px; }
  .wd { font-family:ui-monospace,Menlo,monospace; font-size:11px; letter-spacing:.14em; color:var(--dim); }
  .dt { font-size:14.5px; font-weight:650; }
  .row { display:flex; justify-content:space-between; gap:12px; padding:5px 0; border-top:1px solid var(--line); }
  .row:first-of-type { border-top:0; }
  .xn { font-size:13px; color:var(--muted); }
  .xd { font-family:ui-monospace,Menlo,monospace; font-size:12px; color:var(--dim); white-space:nowrap; }
  .cta { margin-top:26px; display:flex; flex-direction:column; gap:10px; }
  .btn { display:block; text-align:center; text-decoration:none; border-radius:999px; padding:15px 18px; font-size:15px; font-weight:700; }
  .btn.primary { background:var(--ink); color:#0a0a0a; }
  .btn.ghost { border:1px solid var(--line); color:var(--muted); }
  .note { margin-top:16px; font-size:12px; line-height:1.6; color:var(--dim); }
  .err { margin-top:40px; color:var(--muted); font-size:14px; line-height:1.7; }
  [dir="rtl"] .brand { letter-spacing:.12em; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">MadSet.</div>
  <div id="app"><div class="err" id="loading">Loading plan…</div></div>
</div>
<script>
const NAMES = {"legpress":"Leg Press","legcurl":"Plate-Loaded Seated Leg Curl","lyinglegcurl":"Lying Leg Curl Machine","calf":"Standing Calf Raise Machine","crunch":"Abdominal Crunch Machine + Plank","latpull":"Lat Pulldown","csrow":"Chest-Supported Row","revpec1":"Reverse Pec Deck","preacher1":"Preacher Curl","bayes1":"Bayesian Cable Curl","chest":"Chest Press","pecdeck":"Pec Deck Fly","incline":"Incline Chest Press","lowcablefly":"Low-to-High Cable Fly","shoulder":"Shoulder Press","ohext1":"Overhead Extension","latraise1":"Lateral Raise","ohext2":"Overhead Extension","onearm":"One-Arm Pushdown","preacher2":"Preacher Curl","bayes2":"Bayesian Cable Curl","cablelat":"Cable Lateral Raise","revpec2":"Reverse Pec Deck","bbbench":"Barbell Bench Press","dbbench":"Dumbbell Bench Press","inclinedb":"Incline Dumbbell Press","cablefly":"Cable Crossover","pushup":"Push-Up","dips":"Chest Dips","pullup":"Pull-Up","cgpulldown":"Close-Grip Lat Pulldown","straightarm":"Straight-Arm Pulldown","cablerow":"Seated Cable Row","dbrow":"One-Arm Dumbbell Row","bbrow":"Barbell Row","facepull":"Face Pull","shrug":"Dumbbell Shrug","dbshoulderpress":"Dumbbell Shoulder Press","bbohp":"Barbell Overhead Press","dblatraise":"Dumbbell Lateral Raise","dbrear":"Bent-Over Rear Delt Fly","machinecurl":"Bicep Curl Machine","dbcurl":"Dumbbell Curl","ezcurl":"EZ-Bar Curl","inclinecurl":"Incline Dumbbell Curl","ropepushdown":"Rope Pushdown","skullcrusher":"EZ-Bar Skull Crusher","dboverheadext":"Dumbbell Overhead Extension","hacksquat":"Hack Squat Machine","bbsquat":"Barbell Back Squat","gobletsquat":"Goblet Squat","legext":"Leg Extension","bulgarian":"Bulgarian Split Squat","lunge":"Walking Lunge","rdldb":"Dumbbell Romanian Deadlift","rdlbb":"Barbell Romanian Deadlift","hipthrust":"Hip Thrust Machine","abduction":"Hip Abduction Machine","seatedcalf":"Seated Calf Raise","calfpress":"Calf Press on Leg Press","plank":"Plank","cablecrunch":"Cable Crunch","legraise":"Hanging Leg Raise"};
const AR = (navigator.language || "").toLowerCase().startsWith("ar");
const WD_EN = ["","SUN","MON","TUE","WED","THU","FRI","SAT"];
const WD_AR = ["","الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
const T = AR ? {
  kicker:"خطة تدريب مُشارَكة", open:"افتحها في MADSET", get:"حمّل MADSET من App Store",
  note:"الخطة كاملة موجودة داخل هذا الرابط نفسه — لا يُرفع أي شيء لأي خادم. افتح الرابط على iPhone فيه MADSET لاستيرادها بضغطة واحدة.",
  bad:"هذا الرابط غير مكتمل أو تالف. اطلب من صاحبه إرساله من جديد من داخل MADSET.",
  newer:"تمرين يحتاج نسخة أحدث من هذه الصفحة"
} : {
  kicker:"Shared training plan", open:"Open in MADSET", get:"Get MADSET on the App Store",
  note:"The whole plan lives inside this link itself — nothing is uploaded to any server. Open it on an iPhone with MADSET to import it in one tap.",
  bad:"This link is incomplete or damaged. Ask the sender to share it again from MADSET.",
  newer:"exercise from a newer version"
};
if (AR) { document.documentElement.lang = "ar"; document.documentElement.dir = "rtl"; }

function esc(s){ const d=document.createElement("div"); d.textContent=s; return d.innerHTML; }

async function inflate(bytes){
  const ds = new DecompressionStream("deflate-raw");
  const stream = new Blob([bytes]).stream().pipeThrough(ds);
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

function b64urlDecode(s){
  s = s.replace(/-/g,"+").replace(/_/g,"/");
  while (s.length % 4) s += "=";
  const bin = atob(s), out = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i);
  return out;
}

function fail(){ document.getElementById("app").innerHTML = '<div class="err">'+esc(T.bad)+'</div>'; }

async function main(){
  const frag = location.hash.slice(1);
  if (!frag.startsWith("M1.")) return fail();
  let plan;
  try {
    const json = new TextDecoder().decode(await inflate(b64urlDecode(frag.slice(3))));
    plan = JSON.parse(json);
  } catch (e) { return fail(); }
  if (!plan || plan.v !== 1 || !Array.isArray(plan.d)) return fail();

  let html = '<div class="kicker">'+esc(T.kicker)+'</div>';
  html += '<h1>'+esc(AR ? (plan.na || plan.n) : plan.n)+'</h1>';
  for (const day of plan.d){
    if (!day.x || !day.x.length) continue;
    const wd = (day.w>=1 && day.w<=7) ? day.w : 1;
    html += '<div class="day"><div class="dayhead"><span class="wd">'+(AR?WD_AR[wd]:WD_EN[wd])+'</span>';
    html += '<span class="dt">'+esc(AR ? (day.ta || day.t) : day.t)+'</span></div>';
    for (const x of day.x){
      const name = x.e ? (NAMES[x.e] || T.newer) : (x.n || "—");
      const range = x.rl === x.rh ? String(x.rl) : x.rl+"–"+x.rh;
      const unit = x.m === "seconds" ? "s" : "";
      html += '<div class="row"><span class="xn">'+esc(name)+'</span><span class="xd">'+x.s+"×"+range+unit+'</span></div>';
    }
    html += '</div>';
  }
  html += '<div class="cta">';
  html += '<a class="btn primary" href="madset://plan#'+encodeURIComponent(frag).replace(/%2E/gi,".")+'">'+esc(T.open)+'</a>';
  html += '<a class="btn ghost" href="https://apps.apple.com/app/id6804025895">'+esc(T.get)+'</a>';
  html += '</div><div class="note">'+esc(T.note)+'</div>';
  document.getElementById("app").innerHTML = html;
}
main();
</script>
</body>
</html>
